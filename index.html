<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BM Rafi Sardar — The Next Dimension</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #050507;
            --gold-primary: #D4AF37;
            --gold-bright: #F7E199;
            --gold-dark: #997A15;
            --silver-primary: #C8CDD5;
            --silver-muted: #8A93A2;
            --glass-border: rgba(212, 175, 55, 0.3);
            --glass-highlight: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-obsidian);
            color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        /* =========================================
           1. DESKTOP SITE REQUIRED OVERLAY GATE
           ========================================= */
        #desktopGate {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle at top, #15120A 0%, #050507 75%);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .gate-card {
            max-width: 440px;
            width: 100%;
            border-radius: 28px;
            padding: 38px 26px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .gate-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 1px solid var(--gold-primary);
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--gold-bright);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.35);
        }

        .gate-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--gold-bright);
            margin-bottom: 12px;
        }

        .gate-desc {
            font-size: 14px;
            color: var(--silver-primary);
            margin-bottom: 22px;
            line-height: 1.7;
        }

        .gate-steps {
            text-align: left;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px 18px;
            font-size: 13px;
            color: #E2E8F0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gate-steps span {
            color: var(--gold-bright);
            font-weight: 700;
        }

        /* =========================================
           2. INTERACTIVE LIQUID DROP FOLLOWER
           ========================================= */
        #liquidDrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            transition: opacity 0.25s ease, transform 0.18s ease-out;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.45), rgba(212, 175, 55, 0.22) 55%, rgba(200, 205, 213, 0.08) 100%);
            backdrop-filter: blur(6px) brightness(1.25);
            -webkit-backdrop-filter: blur(6px) brightness(1.25);
            border: 1px solid rgba(247, 225, 153, 0.65);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.55);
            animation: liquidMorph 4s ease-in-out infinite;
        }

        #liquidDrop.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes liquidMorph {
            0%, 100% { border-radius: 52% 48% 54% 46% / 48% 52% 48% 52%; }
            33% { border-radius: 44% 56% 48% 52% / 55% 45% 55% 45%; }
            66% { border-radius: 56% 44% 52% 48% / 46% 54% 46% 54%; }
        }

        /* Ambient Orbs */
        .ambient-orb-gold {
            position: fixed;
            top: -100px;
            left: -80px;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(5, 5, 7, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 10s ease-in-out infinite;
        }

        .ambient-orb-silver {
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 205, 213, 0.15) 0%, rgba(5, 5, 7, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 13s ease-in-out infinite reverse;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(25px, -25px) scale(1.08); }
        }

        /* Liquid Glass Panel */
        .liquid-glass {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.015) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 56px -12px rgba(0, 0, 0, 0.88), inset 0 1px 1px var(--glass-highlight);
        }

        /* Floating Navigation (Wider Desktop Scale) */
        .navbar-wrapper {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 0 24px;
            display: flex;
            justify-content: center;
        }

        .navbar {
            width: 100%;
            max-width: 1140px;
            border-radius: 999px;
            padding: 15px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.16em;
            color: var(--gold-bright);
        }

        .brand-logo span {
            color: var(--silver-muted);
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.22em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 14px;
            color: var(--silver-primary);
        }

        .nav-links a:hover { color: var(--gold-bright); }

        .nav-cta {
            padding: 9px 22px;
            border-radius: 999px;
            border: 1px solid rgba(212, 175, 55, 0.6);
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-bright) !important;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: var(--gold-primary);
            color: #050507 !important;
        }

        /* Wide Luxury Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 130px 24px 130px;
            display: flex;
            flex-direction: column;
            gap: 64px;
        }

        /* Hero Section */
        .hero-card {
            border-radius: 34px;
            padding: 68px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        }

        .badge-pill {
            display: inline-block;
            padding: 7px 20px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--silver-primary);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(200, 205, 213, 0.24);
            margin-bottom: 28px;
