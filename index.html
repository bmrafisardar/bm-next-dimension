  <style>
    /* ==========================================================================
       1. ROOT VARIABLES & OBSIDIAN LIQUID GLASS THEME
       ========================================================================== */
    :root {
      --bg-obsidian: #050507;
      --bg-elevated: #0b0c10;
      --gold-primary: #D4AF37;
      --gold-light: #F7E199;
      --gold-deep: #997A15;
      --silver: #C8CDD5;
      --silver-dim: rgba(200, 205, 213, 0.72);
      --glass-bg: rgba(16, 17, 23, 0.56);
      --glass-bg-strong: rgba(12, 13, 18, 0.78);
      --glass-border: rgba(212, 175, 55, 0.28);
      --glass-border-silver: rgba(200, 205, 213, 0.2);
      --glass-highlight: rgba(247, 225, 153, 0.16);
      --shadow-deep: 0 24px 64px rgba(0, 0, 0, 0.75);
      --shadow-gold: 0 12px 36px rgba(212, 175, 55, 0.16);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      --transition-smooth: all 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-obsidian);
      color: #F5F6F8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(212, 175, 55, 0.11) 0%, transparent 42%),
        radial-gradient(circle at 84% 28%, rgba(200, 205, 213, 0.08) 0%, transparent 44%),
        radial-gradient(circle at 50% 88%, rgba(212, 175, 55, 0.09) 0%, transparent 48%),
        var(--bg-obsidian);
      color: #F5F6F8;
      line-height: 1.65;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Subtle Mesh & Grid Glow */
    .ambient-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 205, 213, 0.03) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
    }

    /* ==========================================================================
       2. DESKTOP MODE REQUIRED GATE (MOBILE < 750PX)
       ========================================================================== */
    #desktopGate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(5, 5, 7, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @media (max-width: 749px) {
      #desktopGate {
        display: flex;
      }
      body {
        overflow: hidden;
      }
    }

    .gate-modal {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, rgba(22, 23, 30, 0.85), rgba(10, 10, 14, 0.92));
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: var(--radius-xl);
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(247, 225, 153, 0.3);
      position: relative;
      overflow: hidden;
    }

    .gate-modal::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -20%;
      width: 140%;
      height: 70%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.16), transparent 65%);
      pointer-events: none;
    }

    .gate-robot-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(247, 225, 153, 0.18), rgba(5, 5, 7, 0.9));
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.25);
      animation: floatGentle 3.6s ease-in-out infinite;
    }

    .gate-title {
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: 0.1em;

      height: 8px;
      border-radius: 50%;

    .nav-pills {

      padding: 0 18px;

      border: 1px solid rgba(200, 205, 213, 0.24);

      -webkit-backdrop-filter: blur(16px);

      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.18), inset 0 1px 0 rgba(247, 225, 153, 0.25);

    .nav-pill-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.26), rgba(247, 225, 153, 0.1));

      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.24), inset 0 1px 0 rgba(247, 225, 153, 0.35);
    }

    /* ==========================================================================
       4. MAIN CENTERED CONTAINER & PAGE SWITCHER
       ========================================================================== */
    .main-container {
      width: 92%;
      max-width: 980px;
      margin: 0 auto;
      padding-top: 114px;
      padding-bottom: 110px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .page-view {
      display: none;
      flex-direction: column;
      gap: 36px;
      animation: pageLiquidReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .page-view.active {
      display: flex;
    }

    @keyframes pageLiquidReveal {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
        filter: blur(6px);
      }
      100% {

        transform: translateY(0) scale(1);
        filter: blur(0);
      }

    /* Unified Liquid Glass Card Base */
    .glass-card {
      background: linear-gradient(155deg, rgba(22, 24, 32, 0.64) 0%, rgba(10, 11, 16, 0.78) 100%);
      backdrop-filter: blur(20px) saturate(150%);

      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow:
        var(--shadow-deep),
        inset 0 1px 0 rgba(247, 225, 153, 0.22),
        inset 0 -1px 0 rgba(200, 205, 213, 0.08);
      position: relative;
      overflow: hidden;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.07) 0%, transparent 38%, transparent 72%, rgba(212, 175, 55, 0.06) 100%);
    }

    /* ==========================================================================
       5. PAGE 1: HERO CARD & HOME SECTIONS
       ========================================================================== */
    .hero-card {
      padding: 46px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;

      border: 1px solid rgba(212, 175, 55, 0.34);
      color: var(--gold-light);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ADE80;
      box-shadow: 0 0 10px #4ADE80;
    }

    /* Circular Gold-Rimmed BM Monogram */
    .bm-monogram {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:

      border: 2px solid var(--gold-primary);
      box-shadow:
        0 0 0 6px rgba(212, 175, 55, 0.08),
        0 18px 42px rgba(0, 0, 0, 0.8),
        inset 0 2px 12px rgba(247, 225, 153, 0.35);
      position: relative;
      transition: var(--transition-smooth);
    }

    .bm-monogram:hover {
      transform: scale(1.04) rotate(2deg);
      box-shadow:
        0 0 0 8px rgba(212, 175, 55, 0.14),
        0 20px 50px rgba(212, 175, 55, 0.25),
        inset 0 2px 14px rgba(247, 225, 153, 0.45);
    }

    .bm-monogram span {
      font-size: 2.3rem;
      font-weight: 900;

    .hero-heading {

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.08rem;
      font-weight: 500;
      color: var(--silver);
      letter-spacing: 0.02em;
      margin-top: -10px;
    }

    /* Inner Dark-Glass Box for Bio */
    .hero-bio-box {
      width: 100%;
      max-width: 760px;
      padding: 22px 26px;
      border-radius: var(--radius-lg);
      background: rgba(5, 5, 8, 0.66);
      border: 1px solid rgba(200, 205, 213, 0.18);
      box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.6);
      color: #E5E7EB;
      font-size: 1rem;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;

      -webkit-backdrop-filter: blur(18px);
      color: var(--gold-light);

      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #F3F4F6;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: inline-flex;
      align-items: center;

      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .btn-silver:hover {
      transform: translateY(-2px);
      border-color: rgba(212, 175, 55, 0.55);
      color: var(--gold-light);
      box-shadow: 0 14px 32px rgba(212, 175, 55, 0.16), inset 0 1px 0 rgba(247, 225, 153, 0.25);
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;

      border: 1px solid rgba(200, 205, 213, 0.18);

    .profiles-section {
