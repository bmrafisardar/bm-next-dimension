    <style>
        :root {
            --bg-obsidian: #050507;
            --gold-primary: #D4AF37;
            --gold-bright: #F7E199;
            --gold-dark: #997A15;
            --silver-primary: #C8CDD5;
            --silver-muted: #8A93A2;
            --glass-border: rgba(212, 175, 55, 0.32);
            --glass-highlight: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #050507;
            color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        /* 1. DESKTOP SITE REQUIRED GATE */
        #desktopGate {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle at top, #1A1508 0%, #050507 80%);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .gate-card {
            max-width: 440px;
            width: 100%;
            border-radius: 28px;
            padding: 38px 26px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95);
        }

        .gate-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 1px solid var(--gold-primary);
            background: rgba(212, 175, 55, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--gold-bright);
        }

        .gate-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--gold-bright);
            margin-bottom: 12px;
        }

        .gate-desc {
            font-size: 14px;
            color: var(--silver-primary);
            margin-bottom: 22px;
        }

        .gate-steps {
            text-align: left;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 16px 18px;
            font-size: 13px;
            color: #E2E8F0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gate-steps span { color: var(--gold-bright); font-weight: 700; }

        /* 2. LIQUID DROP POINTER & TOUCH FOLLOWER */
        #liquidDrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            transition: opacity 0.25s ease, transform 0.18s ease-out;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(212, 175, 55, 0.25) 55%, rgba(200, 205, 213, 0.1) 100%);
            backdrop-filter: blur(6px) brightness(1.3);
            -webkit-backdrop-filter: blur(6px) brightness(1.3);
            border: 1px solid rgba(247, 225, 153, 0.7);
            box-shadow: 0 8px 26px rgba(212, 175, 55, 0.4), inset 0 2px 8px rgba(255, 255, 255, 0.6);
            animation: liquidMorph 4s ease-in-out infinite;
        }

        #liquidDrop.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes liquidMorph {
            0%, 100% { border-radius: 52% 48% 54% 46% / 48% 52% 48% 52%; }
            33% { border-radius: 44% 56% 48% 52% / 55% 45% 55% 45%; }
            66% { border-radius: 56% 44% 52% 48% / 46% 54% 46% 54%; }
        }

        /* Ambient Orbs */
        .ambient-orb-gold {
            position: fixed;
            top: -80px;
            left: -80px;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(5, 5, 7, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-orb-silver {
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 205, 213, 0.18) 0%, rgba(5, 5, 7, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        /* Liquid Glass Panel */
        .liquid-glass {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 56px -12px rgba(0, 0, 0, 0.9), inset 0 1px 1px var(--glass-highlight);
        }

        /* Navigation */
        .navbar-wrapper {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 0 24px;
            display: flex;
            justify-content: center;
        }

        .navbar {
            width: 100%;
            max-width: 1140px;
            border-radius: 999px;
            padding: 16px 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 19px;
            letter-spacing: 0.16em;
            color: var(--gold-bright);
        }

        .brand-logo span {
            color: var(--silver-muted);
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.22em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 14px;
            color: var(--silver-primary);
        }

        .nav-links a:hover { color: var(--gold-bright); }

        .nav-cta {
            padding: 9px 22px;
            border-radius: 999px;
            border: 1px solid rgba(212, 175, 55, 0.6);
            background: rgba(212, 175, 55, 0.14);
            color: var(--gold-bright) !important;
            font-weight: 600;
            font-size: 13px;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 130px 24px 130px;
            display: flex;
            flex-direction: column;
            gap: 64px;
        }

        /* Hero Section */
        .hero-card {
            border-radius: 34px;
            padding: 68px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .badge-pill {
            display: inline-block;
            padding: 7px 20px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--silver-primary);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(200, 205, 213, 0.25);
            margin-bottom: 28px;
        }

        .avatar-ring {
            width: 136px;
            height: 136px;
            margin: 0 auto 28px;
            border-radius: 50%;
            padding: 3.5px;
            background: linear-gradient(135deg, var(--gold-bright), var(--silver-primary), var(--gold-dark));
            box-shadow: 0 0 45px rgba(212, 175, 55, 0.38);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0A0A0E;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-initials {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 0.06em;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title {

            font-size: 62px;

            letter-spacing: 0.05em;
            line-height: 1.12;
            color: var(--gold-bright);
            background: linear-gradient(90deg, #FFFFFF 0%, var(--gold-bright) 50%, var(--silver-primary) 100%);
